name = "media-studio-delivery"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

[vars]
AUTHORIZE_URL = "https://app.example.com/media-studio/api/v1/delivery/check"
DISK_BINDINGS = '{"media-s3":{"binding":"MEDIA","prefix":""}}'
CORS_ORIGINS = "https://app.example.com"
MAX_CACHE_BYTES = "2000000"
CACHE_NAMESPACE = "v1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "replace-with-your-private-media-bucket"

# Set TOKEN_KEY separately using the platform's secret mechanism.
# Bind a custom HTTPS hostname matching the PHP profile URL.
