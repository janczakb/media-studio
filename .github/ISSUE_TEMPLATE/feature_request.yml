name: Feature request
description: Suggest an improvement to a real media workflow.
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Which workflow would this improve?
      description: Explain the problem and who encounters it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you need and any alternatives you considered.
    validations:
      required: true
