<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390">
<title>Studio media grid</title>
<defs><radialGradient id="glow"><stop stop-color="#5669bb" stop-opacity=".27"/><stop offset="1" stop-color="#5669bb" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:system-ui,sans-serif}
.pulse{animation:pulse 4s ease-in-out infinite}
.drift{animation:drift 4.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.63}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.pulse,.drift{animation:none}}
</style>
