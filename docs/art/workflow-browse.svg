</defs>
<style>
  use { transform-box:fill-box; transform-origin:center; }

  .pointer { animation:pointer 5.4s cubic-bezier(.45,0,.22,1) infinite; }
  .highlight { animation:pointer 5.4s cubic-bezier(.45,0,.22,1) infinite; }
  .preview-first { animation: first 5.4s steps(1,end) infinite; }
  .preview-second { animation: second 5.4s steps(1,end) infinite; }
  .preview-third { animation: third 5.4s steps(1,end) infinite; }
  @keyframes first { 0%,100% {opacity:1} 33.333% {opacity:0} }
  @keyframes second { 0%,66.667% {opacity:0} 33.333% {opacity:1} }
  @keyframes third { 0%,100% {opacity:0} 66.667% {opacity:1} }
  @keyframes pointer { 0%,24% {transform:none} 33%,57% {transform:translateX(69px)} 66%,90% {transform:translateX(138px)} }

  @media (prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style>

<rect class="highlight" x="40" y="33" width="46" height="46" rx="12" fill="#d8e5ff" stroke="#b5c9f6"/>
<use href="#triangle" transform="translate(63 56) scale(.63)"/>
<use href="#circle" transform="translate(132 56) scale(.65)"/>
<use href="#hex" transform="translate(201 56) scale(.6)"/>
<path class="pointer" d="m77 69 15 7-7 2-3 7z" fill="#525b7a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
<g class="preview" filter="url(#shadow)">
