<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 286">
<defs>
  <linearGradient id="cyan" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#a9e8fa"/><stop offset="1" stop-color="#62b5eb"/></linearGradient>
  <linearGradient id="violet" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#d7bafe"/><stop offset="1" stop-color="#9186ef"/></linearGradient>
  <linearGradient id="rose" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffd3ca"/><stop offset="1" stop-color="#f399a1"/></linearGradient>
  <linearGradient id="tile" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#71bcff"/><stop offset="1" stop-color="#3869db"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#344d8a" flood-opacity=".2"/></filter>
  <circle id="circle" r="20" fill="url(#cyan)"/>
  <path id="triangle" d="M-4-16Q0-23 4-16L20 13Q23 18 17 18H-17Q-23 18-20 13Z" fill="url(#rose)"/>
  <path id="hex" d="M-3-22Q0-24 3-22L18-13Q21-11 21-8V8Q21 11 18 13L3 22Q0 24-3 22L-18 13Q-21 11-21 8V-8Q-21-11-18-13Z" fill="url(#violet)"/>
</defs>
<style>
  use { transform-box:fill-box; transform-origin:center; }

  .sort { animation:sort 5s cubic-bezier(.5,0,.24,1) infinite; animation-delay:var(--delay); }
  @keyframes sort { 0%,15%,100% {transform:none} 38%,80% {transform:translate(var(--x),var(--y))} }

  @media (prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style>
<g transform="translate(52 52)"><use href="#hex" class="sort" style="--x:0px;--y:0px;--delay:0.0s"/></g><g transform="translate(132 52)"><use href="#triangle" class="sort" style="--x:-80px;--y:80px;--delay:0.027s"/></g><g transform="translate(212 52)"><use href="#circle" class="sort" style="--x:-80px;--y:160px;--delay:0.054s"/></g><g transform="translate(52 132)"><use href="#hex" class="sort" style="--x:0px;--y:80px;--delay:0.081s"/></g><g transform="translate(132 132)"><use href="#triangle" class="sort" style="--x:0px;--y:-80px;--delay:0.108s"/></g><g transform="translate(212 132)"><use href="#circle" class="sort" style="--x:-80px;--y:0px;--delay:0.135s"/></g><g transform="translate(52 212)"><use href="#circle" class="sort" style="--x:160px;--y:0px;--delay:0.162s"/></g><g transform="translate(132 212)"><use href="#triangle" class="sort" style="--x:80px;--y:-160px;--delay:0.189s"/></g><g transform="translate(212 212)"><use href="#hex" class="sort" style="--x:0px;--y:-80px;--delay:0.216s"/></g>
</svg>
