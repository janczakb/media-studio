</defs>
<style>
  use { transform-box:fill-box; transform-origin:center; }
  
  .dim { animation:dim 4.8s ease-in-out infinite; }
  .matched,.filter { animation:select 4.8s ease-in-out infinite; }
  .filter { transform-origin:132px 42px; }
  @keyframes dim { 0%,14%,100% {opacity:.78} 32%,79% {opacity:.18} }
  @keyframes select { 0%,15%,100% {opacity:.62; transform:scale(.95)} 32%,79% {opacity:1; transform:scale(1)} }

  @media (prefers-reduced-motion:reduce) { * { animation:none!important; } }
</style>

