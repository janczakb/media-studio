<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390">
<title>Studio CLI</title>
<defs><radialGradient id="glow"><stop stop-color="#5669bb" stop-opacity=".27"/><stop offset="1" stop-color="#5669bb" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:system-ui,sans-serif}
.pulse{animation:pulse 4s ease-in-out infinite}
.drift{animation:drift 4.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.63}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.pulse,.drift{animation:none}}
</style>
<ellipse cx="332" cy="245" rx="310" ry="172" fill="url(#glow)"/>
<rect x="58" y="63" width="524" height="302" rx="17" fill="#1b202b" stroke="#444e65" /><path d="M58 108h524" fill="none" stroke="#323b50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="75" cy="86" r="2.5" fill="#e17579"/><circle cx="86" cy="86" r="2.5" fill="#edbd72"/><circle cx="97" cy="86" r="2.5" fill="#7ec49b"/><text x="117" y="91" fill="#d9e2f2" font-size="14" font-weight="500">Studio CLI</text><text x="82" y="139" fill="#d9e2f2" font-size="18" font-weight="500">$ flex-studio import ./catalog</text><text x="82" y="185" fill="#94a6ca" font-size="15" font-weight="500">Reading media files…</text><text x="82" y="225" fill="#92d9b8" font-size="16" font-weight="500">✓ Import completed</text><rect x="84" y="252" width="392" height="6" rx="3" fill="#4e78be" stroke="none" class="pulse"/>
</svg>
